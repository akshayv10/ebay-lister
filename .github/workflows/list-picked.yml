name: List picked products
run-name: List picked products / ${{ inputs.mode }}

# Paste the AliExpress link(s) you picked into one text box and press Run. One link
# lists one product; two list two. Because you picked them, the sourcing quality gates
# are ADVISORY here — a rating/reviews/orders/price miss is reported as a warning in the
# report email rather than blocking the listing.
#
# Unlike daily.yml this defaults to `live`: pressing Run publishes real eBay listings.
# Pick mode `dry-run` to fetch and validate without touching eBay or sending email.
#
# Requires ALIEXPRESS_ACCESS_TOKEN — without it `ds.product.get` returns nothing and
# every link fails to prepare.
on:
  workflow_dispatch:
    inputs:
      links:
        description: "AliExpress product link(s) — paste one or two; extra text is ignored"
        type: string
        required: true
      mode:
        description: "live publishes real eBay listings; dry-run validates only"
        type: choice
        options:
          - live
          - dry-run
        default: live

permissions:
  contents: write   # allows committing updated history back to the repo

concurrency:
  group: list-picked
  cancel-in-progress: false

jobs:
  list:
    runs-on: ubuntu-latest
    env:
      # --- non-secret config (committed) ---
      EBAY_ACCOUNT_CONFIG: ebay-account.json
      HISTORY_PATH: state/resale-product-history.jsonl
      RUNS_DIR: ebay-listing-runs
      RUN_TZ: ${{ vars.RUN_TZ || 'Asia/Kolkata' }}
      ALI_DEBUG: ${{ vars.ALI_DEBUG || '0' }}
      EBAY_AUTOFILL_REQUIRED_ASPECTS: "1"
      PICKED_MAX_PRODUCTS: ${{ vars.PICKED_MAX_PRODUCTS || '5' }}
      SHEETS_SPREADSHEET_ID: 10GgtsN_cxhHBvbEYa4vUXBUbC-LqeElkzmRiL3TT0Uk
      SHEETS_TAB_NAME: Auto Lister
      SHEETS_SPREADSHEET_URL: https://docs.google.com/spreadsheets/d/10GgtsN_cxhHBvbEYa4vUXBUbC-LqeElkzmRiL3TT0Uk/edit
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      # --- eBay secrets ---
      EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
      EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
      EBAY_RUNAME: ${{ secrets.EBAY_RUNAME }}
      EBAY_REFRESH_TOKEN: ${{ secrets.EBAY_REFRESH_TOKEN }}
      # --- AliExpress secrets ---
      ALIEXPRESS_APP_KEY: ${{ secrets.ALIEXPRESS_APP_KEY }}
      ALIEXPRESS_APP_SECRET: ${{ secrets.ALIEXPRESS_APP_SECRET }}
      ALIEXPRESS_TRACKING_ID: ${{ secrets.ALIEXPRESS_TRACKING_ID }}
      ALIEXPRESS_ACCESS_TOKEN: ${{ secrets.ALIEXPRESS_ACCESS_TOKEN }}
      # --- OpenAI (eBay copy) ---
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1-mini' }}
      # --- email secrets (the report) ---
      NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
      NOTIFY_FROM: ${{ secrets.NOTIFY_FROM }}
      SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
      SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # LINKS and MODE are read from the environment, never interpolated into the script
      # body — the text box is arbitrary pasted text and `${{ inputs.links }}` inline
      # would be a shell injection.
      - name: List picked products
        env:
          LINKS: ${{ inputs.links }}
          MODE: ${{ inputs.mode }}
        run: |
          if [ "$MODE" = "live" ]; then
            echo "::warning::LIVE MODE — the pasted links will be published as real eBay listings."
            python find-and-prepare-ebay-listings/scripts/list_picked.py --links "$LINKS" --live
          else
            echo "DRY RUN — fetching and validating only; nothing will be listed."
            python find-and-prepare-ebay-listings/scripts/list_picked.py --links "$LINKS"
          fi

      - name: Heartbeat + persist history
        if: always()
        run: |
          mkdir -p state
          date -u +"%Y-%m-%dT%H:%M:%SZ" > state/last-run.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state
          if git diff --cached --quiet; then
            echo "No history changes to commit."
          else
            git commit -m "list picked products $(date -u +%F)"
            git push
          fi
