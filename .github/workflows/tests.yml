name: Tests

# The offline regression suite, on every pull request and every push to main.
#
# Until now nothing ran these automatically — they only executed when someone
# remembered to run them by hand, which is how a stale-cost pricing bug reached review
# in #12. The suite is fast (a few seconds), needs no secrets, and never touches the
# network, so there is no reason not to gate every change on it.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-suite:
    runs-on: ubuntu-latest
    env:
      # No eBay / AliExpress / Gmail / Sheets credentials are provided to this job, so a
      # test that accidentally reached a real API would fail rather than do something
      # real. This flag additionally short-circuits the Drafts-tab calls.
      DRAFT_SHEET_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # Every test file is a plain script that exits non-zero on failure — there is no
      # pytest in this repo. Discovering them by glob means a new test_*.py is picked up
      # without anyone remembering to edit this workflow.
      - name: Run the offline suite
        working-directory: find-and-prepare-ebay-listings/scripts
        run: |
          failed=""
          for test in test_*.py; do
            echo "::group::$test"
            if python3 "$test"; then
              echo "PASS $test"
            else
              echo "::error file=find-and-prepare-ebay-listings/scripts/$test::$test failed"
              failed="$failed $test"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "Failed:$failed"
            exit 1
          fi
          echo "All test files passed."

      # Catches a syntax error in a module no test happens to import.
      - name: Byte-compile every module
        run: python -m compileall -q find-and-prepare-ebay-listings/scripts

      # PyYAML is not a runtime dependency (requirements.txt is just google-auth), and
      # setup-python provides a clean interpreter, so install it just for this check.
      - name: Check workflow YAML is parseable
        run: |
          python -m pip install --quiet pyyaml
          python - <<'PY'
          import pathlib, sys, yaml
          bad = []
          for path in sorted(pathlib.Path(".github/workflows").glob("*.yml")):
              try:
                  yaml.safe_load(path.read_text(encoding="utf-8"))
              except yaml.YAMLError as exc:
                  bad.append(f"{path}: {exc}")
          for item in bad:
              print(f"::error::{item}")
          sys.exit(1 if bad else 0)
          PY
