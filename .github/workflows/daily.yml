name: Daily eBay auto-lister

# AUTOMATION IS LIVE — runs daily at 09:00 IST (03:30 UTC).
#
# DRAFT-FIRST IS THE DEFAULT. A scheduled run sources two products (repository variable
# PRODUCTS_PER_RUN changes that — set it to 1 for a single product a day), enriches and
# validates them, and saves them as DRAFTS for review — it creates nothing on eBay.
# You review them in the workbook's "Drafts" tab, tick Publish? = YES on the ones you
# want, and run the "Publish approved eBay drafts" workflow.
#
# To go back to hands-off automatic listing, set the repository variable
# LISTING_MODE=auto. Scheduled runs then publish immediately again, exactly as before.
# Manual dispatch ignores LISTING_MODE and uses the mode you pick.
#
# To pause entirely, comment out the `schedule` block below (or disable the workflow in
# the Actions tab).
on:
  schedule:
    - cron: "30 3 * * *"  # 09:00 IST daily (IST is UTC+5:30, no DST); may start a few minutes late
  workflow_dispatch:
    inputs:
      mode:
        description: "Operation mode (only one)"
        type: choice
        options:
          - draft           # source + save drafts for review (default; nothing goes live)
          - full            # publishes real eBay listings immediately
          - dry-run         # source + validate only, save nothing
          - sheet-sync-only
          - email-test
        default: draft
      products:
        description: "How many products to source this run"
        type: choice
        options:
          - "2"
          - "1"
        default: "2"

permissions:
  contents: write   # allows committing updated history back to the repo

# Shared with publish-drafts.yml on purpose. Both jobs commit and push state/ (draft
# records and listing history). If they overlapped, one push would be rejected — and a
# lost publish commit would leave a draft marked publishable after its listing already
# went live, so the next approved run would list it a second time.
concurrency:
  group: ebay-lister-state
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      # --- non-secret config (committed) ---
      EBAY_ACCOUNT_CONFIG: ebay-account.json
      HISTORY_PATH: state/resale-product-history.jsonl
      RUNS_DIR: ebay-listing-runs
      DRAFT_DIR: state/drafts
      RUN_TZ: ${{ vars.RUN_TZ || 'Asia/Kolkata' }}
      # How many products a run produces. Manual dispatch wins; a scheduled run uses the
      # repository variable PRODUCTS_PER_RUN; absent both, two products as before.
      PRODUCTS_PER_RUN: ${{ inputs.products || vars.PRODUCTS_PER_RUN || '2' }}
      ALI_DEBUG: ${{ vars.ALI_DEBUG || '0' }}
      SHEETS_SPREADSHEET_ID: 10GgtsN_cxhHBvbEYa4vUXBUbC-LqeElkzmRiL3TT0Uk
      SHEETS_TAB_NAME: Auto Lister
      SHEETS_DRAFT_TAB_NAME: ${{ vars.SHEETS_DRAFT_TAB_NAME || 'Drafts' }}
      SHEETS_SPREADSHEET_URL: https://docs.google.com/spreadsheets/d/10GgtsN_cxhHBvbEYa4vUXBUbC-LqeElkzmRiL3TT0Uk/edit
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      # --- eBay secrets ---
      EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
      EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
      EBAY_RUNAME: ${{ secrets.EBAY_RUNAME }}
      EBAY_REFRESH_TOKEN: ${{ secrets.EBAY_REFRESH_TOKEN }}
      # --- AliExpress secrets ---
      ALIEXPRESS_APP_KEY: ${{ secrets.ALIEXPRESS_APP_KEY }}
      ALIEXPRESS_APP_SECRET: ${{ secrets.ALIEXPRESS_APP_SECRET }}
      ALIEXPRESS_TRACKING_ID: ${{ secrets.ALIEXPRESS_TRACKING_ID }}
      # Seller token for ds.product.get (review count + authoritative rating, variants) +
      # freight. Optional: without it the run still sources from feed data (orders +
      # approximate rating), only the review-count gate is skipped and listings are
      # single-variation. Re-mint with mint_ali_token.py when it expires.
      ALIEXPRESS_ACCESS_TOKEN: ${{ secrets.ALIEXPRESS_ACCESS_TOKEN }}
      # --- OpenAI (eBay copy) ---
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1-mini' }}
      # --- email secrets ---
      NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
      NOTIFY_FROM: ${{ secrets.NOTIFY_FROM }}
      SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
      SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # Publishing happens on mode=full, or on a scheduled run when the repository
      # variable LISTING_MODE is set to "auto". Scheduled runs otherwise draft for review.
      # Any other mode runs daily_run.py with no --live flag, which never publishes.
      - name: Run lister
        if: github.event_name == 'schedule' || inputs.mode == 'draft' || inputs.mode == 'full' || inputs.mode == 'dry-run'
        env:
          LIVE: ${{ (inputs.mode == 'full' || (github.event_name == 'schedule' && vars.LISTING_MODE == 'auto')) && 'yes' || 'no' }}
          DRAFT: ${{ (inputs.mode == 'draft' || (github.event_name == 'schedule' && vars.LISTING_MODE != 'auto')) && 'yes' || 'no' }}
        run: |
          echo "Targeting $PRODUCTS_PER_RUN product(s) this run."
          if [ "$LIVE" = "yes" ]; then
            echo "::warning::LIVE MODE — this run will publish real eBay listings."
            python find-and-prepare-ebay-listings/scripts/daily_run.py --live
          elif [ "$DRAFT" = "yes" ]; then
            echo "DRAFT MODE — saving drafts for review; nothing will be listed."
            python find-and-prepare-ebay-listings/scripts/daily_run.py --draft
          else
            echo "DRY RUN — sourcing and validating only; nothing will be listed."
            python find-and-prepare-ebay-listings/scripts/daily_run.py
          fi

      - name: Upload draft review page
        if: always() && (github.event_name == 'schedule' || inputs.mode == 'draft')
        uses: actions/upload-artifact@v4
        with:
          name: draft-review-${{ github.run_id }}
          path: ebay-listing-runs/drafts-preview.html
          if-no-files-found: ignore
          retention-days: 30

      - name: Backfill and sync Google Sheet
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'sheet-sync-only'
        run: python find-and-prepare-ebay-listings/scripts/sheet_sync.py --backfill-history

      - name: Send notification test
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'email-test'
        run: python find-and-prepare-ebay-listings/scripts/notify.py --test

      # Drafts live under state/, so this commit is now load-bearing: losing it would
      # drop a draft the review email already announced. Retry on rejection.
      - name: Heartbeat + persist history
        if: always()
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          mkdir -p state
          date -u +"%Y-%m-%dT%H:%M:%SZ" > state/last-run.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state
          if git diff --cached --quiet; then
            echo "No history changes to commit."
            exit 0
          fi
          git commit -m "daily run heartbeat + history $(date -u +%F)"
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:$BRANCH"; then
              echo "Persisted state on attempt $attempt."
              exit 0
            fi
            echo "Push rejected; rebasing onto origin/$BRANCH and retrying ($attempt)."
            git pull --rebase origin "$BRANCH" || true
            sleep $((attempt * 3))
          done
          echo "::error::Could not persist state/ — drafts from this run may be missing on the next run."
          exit 1
